[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deceased-donor-kidney-utilization"
version = "0.1.0"
description = "Reproducibility code for A Data-Driven Approach towards Improving Deceased-Donor Kidney Utilization"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "Aditya Shankar Garg"},
  {name = "Itai Feigenbaum"},
  {name = "Miko E. Yu"},
  {name = "Sumit Mohan"},
  {name = "Jay Sethuraman"},
]
dependencies = [
  "duckdb==1.1.3",
  "pandas==2.3.3",
  "numpy==1.26.4",
  "pyarrow==20.0.0",
  "pyreadstat==1.3.2",
  "pgeocode==0.5.0",
  "scikit-learn==1.7.0",
  "xgboost==3.2.0",
  "catboost==1.2.8",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
]

[tool.setuptools]
packages = ["kidney_utilization"]
